apiVersion: v1
kind: Service
metadata:
  # This name is what nginx uses in proxy_pass — "backend-service"
  # Kubernetes DNS resolves this name to the pod IPs automatically
  name: backend-service
  labels:
    app: {{ .Release.Name }}-backend
spec:
  type: {{ .Values.service.type }}
  selector:
    # Routes traffic to pods with this label — matches the Deployment above
    app: {{ .Release.Name }}-backend
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}