# --- Replica count ---
# How many pods to run. Kubernetes spreads them across nodes.
# Think of this like desired count in an ECS service.
replicaCount: 2

# --- Image config ---
image:
  # Full Artifact Registry path to the image
  repository: europe-west2-docker.pkg.dev/mt-2dportal/demo-app/backend
  # Image tag — we update this on every deployment
  tag: "v1.0.2"
  # IfNotPresent = only pull if the image isn't already on the node.
  # Always = pull every time (useful in dev, wasteful in prod).
  pullPolicy: IfNotPresent

# --- Service config ---
service:
  # ClusterIP = internal only, not exposed outside the cluster.
  # The frontend calls this service by name via Kubernetes DNS.
  # Think of it like a private ALB only accessible inside the VPC.
  type: ClusterIP
  port: 5000

# --- Resource limits ---
# Always set these in production — without them one rogue pod can
# starve every other pod on the node.
# Think of it like setting Lambda memory and timeout limits.
resources:
  requests:
    cpu: 100m       # 100 millicores = 0.1 of a CPU core
    memory: 128Mi   # 128 megabytes
  limits:
    cpu: 500m       # max 0.5 of a CPU core
    memory: 256Mi

# --- Autoscaling ---
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  # Scale up when average CPU across all pods exceeds 70%
  targetCPUUtilizationPercentage: 70

# --- App config ---
# These become environment variables inside the container.
# Think of it like Lambda environment variables.
env:
  APP_VERSION: "v1.0.2"