apiVersion: v2

# Name of the chart — used in helm commands
# e.g. helm install backend ./helm/backend
name: backend

# Human readable description
description: FastAPI backend service for the demo app

# Chart version — bump this when you change the chart itself
# (not the app — that's appVersion below)
version: 0.1.0

# App version — the version of the actual application
# We'll update this to match the Docker image tag
appVersion: "1.0.1"