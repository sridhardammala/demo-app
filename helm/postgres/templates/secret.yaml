apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: demo-app
type: Opaque
stringData:
  # stringData lets us write plain text — Kubernetes base64 encodes automatically
  POSTGRES_DB:       {{ .Values.auth.database | quote }}
  POSTGRES_USER:     {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
  # Full connection URL injected into FastAPI backend later
  DATABASE_URL: "postgresql://{{ .Values.auth.username }}:{{ .Values.auth.password }}@postgres-service:{{ .Values.service.port }}/{{ .Values.auth.database }}"