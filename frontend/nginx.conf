server {
    listen 80;

    # Serve static files (our HTML page) from this directory.
    # When the browser requests /, nginx returns index.html.
    # Think of this like S3 static website hosting.
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Proxy any request starting with /api/ to the backend service.
    # "backend-service" is the Kubernetes Service name we create in Helm.
    # Kubernetes DNS (CoreDNS) resolves "backend-service" to the backend pod IP.
    # This is like a private Route 53 hosted zone resolving an internal ALB.
    # The trailing slash on proxy_pass strips /api/ before forwarding.
    # So /api/items becomes /items on the backend.
    location /api/ {
        proxy_pass http://backend-service:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}