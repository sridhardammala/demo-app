name: CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'

permissions:
  contents: write
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: europe-west2
  ARTIFACT_REGISTRY: europe-west2-docker.pkg.dev
  REPOSITORY: demo-app

jobs:
  # Detect which services changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ─────────────────────────────────────────
  # JOB 1 — Build and push backend image
  # ─────────────────────────────────────────
  build-backend:
    name: Build and push backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Set image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ env.IMAGE_TAG }} \
            ./backend

      - name: Push backend image
        run: |
          docker push \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ env.IMAGE_TAG }}

      - name: Update backend values.yaml
        run: |
          sed -i "s/tag: .*/tag: \"${{ env.IMAGE_TAG }}\"/" helm/backend/values.yaml
          sed -i "s/APP_VERSION: .*/APP_VERSION: \"${{ env.IMAGE_TAG }}\"/" helm/backend/values.yaml
          sed -i "s/appVersion: .*/appVersion: \"${{ env.IMAGE_TAG }}\"/" helm/backend/Chart.yaml

      - name: Commit updated values.yaml
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add helm/backend/values.yaml helm/backend/Chart.yaml
          git diff --staged --quiet || git commit -m "chore: bump backend image to ${{ env.IMAGE_TAG }} [skip ci]"
          git push

  # ─────────────────────────────────────────
  # JOB 2 — Build and push frontend image
  # ─────────────────────────────────────────
  build-frontend:
    name: Build and push frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Set image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ env.IMAGE_TAG }} \
            ./frontend

      - name: Push frontend image
        run: |
          docker push \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ env.IMAGE_TAG }}

      - name: Update frontend values.yaml
        run: |
          sed -i "s/tag: .*/tag: \"${{ env.IMAGE_TAG }}\"/" helm/frontend/values.yaml
          sed -i "s/appVersion: .*/appVersion: \"${{ env.IMAGE_TAG }}\"/" helm/frontend/Chart.yaml

      - name: Commit updated values.yaml
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add helm/frontend/values.yaml helm/frontend/Chart.yaml
          git diff --staged --quiet || git commit -m "chore: bump frontend image to ${{ env.IMAGE_TAG }} [skip ci]"
          git push